[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-ag-ui"
dynamic = ["version"]
description = "Django ↔ Pydantic-AI ↔ AG-UI integration: async view, tool registry, audit logger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "ag-ui", "pydantic-ai", "agent", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    # The agent runtime this transport builds on: agent construction, the tool
    # registry, toolset and capability composition, the guard and failure
    # policies, audit, user resolution, and the storage contracts. It is the
    # merge of django-pydantic-agent, the host, and djangorestframework-pydantic-ai,
    # which it carries as ``django_spec_agents.spec_tools`` behind ``[specs]``.
    # Floored at 0.6.2, where a call the MCP server refuses for permission
    # (JSON-RPC -32006) raises ``PermissionDenied`` out of the bridge, so the run
    # ends in ``RUN_ERROR``. Below it the refusal was a failed call the default
    # ``TOOL_FAILURE`` policy redacts, and the run finished as though the model
    # had only been told no. Held by ``tests/agent/test_mcp_permission_refusal.py``.
    # 0.6.0 was the floor before that, where ``build_tool_catalog`` takes
    # ``mcp_server=``, which ``ToolsView`` passes on every mount, and where
    # ``integrations.mcp.MCPToolset`` bridges a django-spec-mcp server for
    # ``mcp_server=``. Below it the keyword is a ``TypeError`` on every
    # ``GET tools/``. Held by ``tests/agent/test_mcp_server.py``. Subsumed.
    # 0.2.0 was the floor before that, where ``[specs]`` is the kernel alone and the toolset
    # serves django-service-specs specs, read through ``kernel_spec``: the
    # ``service_specs=`` pre-check reads the compiled spec's ``permissions``,
    # and the toolset reads the run's request from ``AgentDeps.call_context``,
    # which first exists there and which the default deps fill. Below it the
    # toolset served drf-services specs, built its own request, and imported
    # drf-services, which this package no longer installs.
    # What 0.1.0, its first release, bought still holds, for three reasons. It
    # is the release carrying the import paths this package reads. Its gates hold it equal in
    # behaviour to django-pydantic-agent 0.28.2 and djangorestframework-pydantic-ai
    # 0.36.1, the releases this package's floors last named, so everything those
    # floors bought holds from here: the guard reading all four destructive
    # vocabularies, a ``SpecRegistry`` reaching the toolset whole rather than
    # flattened, a refused bridged call raised as ``ToolFailed`` rather than
    # returned as a success, the failure policy pinned outermost so a
    # ``capabilities=`` consumer is handed the tool's own exception, and a
    # refusal's field detail streamed once rather than twice. And it offers a
    # registry tool to the model under its registered name (``@tool(name=...)``),
    # which is the name this package keys approval prompts by; below it the
    # function's own name was offered, so a prompt for a renamed tool reached
    # nobody. Held by ``tests/agent/test_registered_tool_name.py``.
    # ``docs/memory.md`` imports ``memory_namespace_for_user`` and
    # ``DefaultMemoryStore`` from it, and ``check_docs_snippets.py`` resolves those
    # imports against the installed package, so a page a valid install cannot
    # follow fails there rather than quietly.
    "django-spec-agents>=0.6.2",
    # Slim core + the AG-UI adapter only — avoids the full meta-package's
    # logfire / fastmcp / temporalio / otel stack. Pick a provider via the
    # extras below (or install the provider lib yourself).
    # The floor is the server-held history mode. A resumed or forked run hands
    # the adapter its stored snapshot as ``message_history``, and 2.63 is the
    # first release whose adapter can take that snapshot as the conversation
    # (``manage_message_history="server"``): it runs on the snapshot plus only
    # the client's new turn, and cuts the snapshot where the client resubmits a
    # stored message. Below it the adapter prepended the snapshot to everything
    # the client posted, so a client replaying its transcript on a resume sent
    # it to the model twice. Held by
    # ``tests/agent/test_resumed_history_through_the_view.py``.
    # Every earlier floor stays inside this one. 2.58 is a security fix
    # (GHSA-5pfm-2g3g-gh85): below it the adapter dropped client-submitted
    # compaction parts *after* it stripped unresolved tool calls from the end
    # of the client's messages, so a client could arrange its history to leave
    # its own tool call last and have the run execute it, with its arguments,
    # before any model request. Held by
    # ``test_a_resumed_run_never_executes_a_tool_call_the_client_wrote``, which
    # from 2.63 also shows the client's messages never reach a resumed run's
    # history at all. 2.55 made pydantic-ai require Python 3.11, which is why
    # this package's ``requires-python`` moved with it rather than gaining a
    # marker that would leave 3.10 installs on the exposed versions. And 2.37
    # is the first release with a stream in which every TOOL_CALL_START names
    # an assistant message the stream actually announced. A response whose
    # first part is a tool call has no text to open that message with, and
    # below 2.37 the `parentMessageId` was emitted anyway, naming a message no
    # event carried -- a client could only answer by minting an id of its own,
    # which then matches nothing in the history echoed back. From 2.37 an
    # empty message is opened and closed there instead. Load-bearing rather
    # than tidy: the wire fixture the browser lane builds against is generated
    # from this endpoint, and below that version it regenerates differently.
    # ``[ui]`` rather than ``[ag-ui]``, and the two differ only by a cap. Both
    # bring starlette for the adapter; ``[ag-ui]`` adds ag-ui-protocol, which
    # this package declares itself below, and from 2.47 it caps that protocol
    # below 1.0. With the floor below at 1.0, a resolver asked for both held
    # pydantic-ai-slim at 2.46 without a word, so every install of this package
    # and of everything built on it ran a pydantic-ai older than the one its
    # siblings lock, while the drift job stayed green. ``[ui]`` asks nothing of
    # the protocol, which leaves the floor below the only statement about it.
    # Upstream capped it because its own tests assume the pre-1.0 wire; this
    # endpoint has written the 1.0 wire since that floor was set, and the
    # adapter forwards the installed protocol version rather than pinning an
    # older one. Once pydantic-ai#8627 lifts the cap, ``[ag-ui]`` can return
    # and nothing else moves.
    "pydantic-ai-slim[ui]>=2.63,<3",
    # The floor is the protocol's 1.0, and it is load-bearing for the same
    # reason the pydantic-ai floor above is: 1.0 changed what this endpoint
    # writes. It made TEXT_MESSAGE_START's role optional with no default, and an
    # optional field with no value is left off the wire, so on pydantic-ai below
    # 2.63 the event stopped carrying the `"role": "assistant"` every client
    # already assumes (the web component's pinned `@ag-ui/core` parses it with
    # `.default("assistant")`); from 2.63 the adapter sets it again, and stamps
    # RUN_STARTED with the `protocolVersion`. Either way the wire fixture the
    # browser lane builds against regenerates differently on either side of
    # 1.0. A window spanning both would leave that fixture true of only one
    # end, and the event-set contract likewise, since
    # 1.0 removed the deprecated THINKING_* family nothing here emits. It also
    # retired the flat `binary` input part, which is what lets
    # `strip_binary_content` stop handling one. What the earlier floors bought
    # (the tool-approval interrupt/resume lifecycle, and the SUBAGENT_* events
    # the observer imports at module level) is all inside 1.0. pydantic-ai-slim
    # only floors the distribution at >=0.1.10, so this floor is ours to state.
    "ag-ui-protocol>=1.0",
]

[project.optional-dependencies]
# Model-provider extras (slim ships none). Install one to use a "provider:model"
# MODEL string, e.g. `pip install django-ag-ui[anthropic]`.
# Anthropic's floor is higher than the others and stays that way. The
# ``anthropic`` SDK 1.0.0 (PyPI, 2026-08-20) is rebuilt on ``httpx2`` and drops
# legacy ``httpx``, and every pydantic-ai before 2.33 hands ``AnthropicProvider``
# an ``httpx.AsyncClient`` the 1.x SDK rejects at runtime -- permitted without
# being supported, so a fresh install at the old floor resolved a broken set.
anthropic = ["pydantic-ai-slim[anthropic]>=2.33,<3"]
openai = ["pydantic-ai-slim[openai]>=2,<3"]
google = ["pydantic-ai-slim[google]>=2,<3"]
# In-process bridge that exposes a django-spec-mcp server's tools as a
# Pydantic-AI toolset (``mcp_server=``). Floored with the core dependency
# above, at 0.6.2, for the reasons given there; its own ``[mcp]`` extra floors
# django-spec-mcp.
mcp = ["django-spec-agents[mcp]>=0.6.2"]
# Expose django-service-specs specs directly as agent tools via django-spec-agents'
# ``spec_tools.SpecCapability`` -- no MCP server in the path (service_specs=).
# Floored with the core dependency above, at 0.6.2, for the reasons given there.
specs = ["django-spec-agents[specs]>=0.6.2"]
# pydantic-ai-harness capabilities (lazy-imported; core stays slim): step
# persistence, compaction, subagents, and the rest of the graduated set. Attach
# via capabilities=.
harness = ["pydantic-ai-harness>=0.13"]
# CodeMode as well — wrapping many tools (e.g. the MCP bridge) into one
# sandboxed `run_code`. Separate because the sandbox (`pydantic-monty`) is
# 7.5 MB installed, which a project wiring step persistence should not pay for
# a capability it never configures. `[harness]` required it until this split.
code-mode = ["pydantic-ai-harness[code-mode]>=0.13"]

[project.urls]
Homepage = "https://github.com/Artui/django-ag-ui"
Repository = "https://github.com/Artui/django-ag-ui"
Issues = "https://github.com/Artui/django-ag-ui/issues"

[tool.hatch.version]
path = "django_ag_ui/version.py"
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["django_ag_ui"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.32",
    "pre-commit>=3.8.0",
    "pytest>=8.0",
    "pytest-django>=4.11.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.0",
    # The [specs] and [mcp] extras' backing package, so the spec capability, the
    # spec-mcp bridge and their tests run in dev.
    "django-spec-agents[specs,mcp]>=0.6.2",
    # The [harness] extra's backing package, so the CodeMode recipe test runs in dev.
    "pydantic-ai-harness[code-mode]>=0.13",
    # Provider libs so the API_KEY / PROVIDER model-building path is exercised
    # in dev/CI (the extras above ship to consumers, not the dev env).
    # Floored with the ``anthropic`` extra above, for the reason given there --
    # the floor job resolves this group too.
    "pydantic-ai-slim[anthropic,openai,google]>=2.33",
    # A real ASGI server for the heartbeat's wire test. Every in-process client
    # reads a response it already holds, so whether a frame reaches the socket
    # *during* a silence -- the only thing an idle proxy sees -- needs a socket.
    "uvicorn>=0.30",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
addopts = "--cov=django_ag_ui --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
filterwarnings = [
    # Most fixtures construct a view in its default state, which is exactly the
    # state the CSRF guard warns about — so without this every one of them
    # carries the same warning and the signal is lost. ``pytest.warns`` still
    # sees it (it installs its own "always" filter), which is where the guard
    # is asserted. (Matched without the "django-ag-ui:" prefix — a colon in the
    # pattern is pytest's own field separator.)
    "ignore:.*AG-UI endpoint is CSRF-exempt",
]

[tool.coverage.run]
branch = true
source = ["django_ag_ui"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = [
    "E203",
    "E231",
    "F811",
    "E722",
    "E741",
    # PEP 695 syntax. The package uses ``TypeVar`` + ``Generic[T]``; without
    # these three, ``ruff --fix`` rewrites code *into* the syntax CLAUDE.md
    # forbids.
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_ag_ui"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md forbids every relative form, including single-dot. TID's default is
# "parents", which lets ``from .foo import bar`` through.
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
root = ["./django_ag_ui"]

# bump-my-version drives `make release-bump` — it rewrites the version in
# django_ag_ui/version.py and promotes the CHANGELOG [Unreleased] block
# under a new dated heading.
[tool.bumpversion]
current_version = "0.74.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_ag_ui/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-ag-ui/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-ag-ui/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-ag-ui/compare/v{current_version}...v{new_version}"""
