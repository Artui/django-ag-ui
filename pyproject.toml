[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-ag-ui"
dynamic = ["version"]
description = "Django ↔ Pydantic-AI ↔ AG-UI integration: async view, tool registry, audit logger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "ag-ui", "pydantic-ai", "agent", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    # The settings-agnostic agent-host substrate this transport builds on:
    # agent construction, the tool registry, toolset/capability composition,
    # audit, user resolution, and the storage contracts.
    # Floored at 0.20 for the recipe in ``docs/memory.md``: that page imports
    # ``memory_namespace_for_user`` and ``DefaultMemoryStore``, and neither
    # exists below it. This is the weaker kind of floor -- nothing this package
    # imports breaks at 0.19 -- but a shipped page that a valid install cannot
    # follow is drift, and ``check_docs_snippets.py`` resolves those imports
    # against the *installed* package so that it cannot happen quietly.
    # 0.19 is load-bearing for ``service_specs=``: below it a ``SpecRegistry``
    # was flattened to ``name -> spec`` before the capability was built, so
    # everything an entry carried beyond its spec -- its tags, its
    # ``OfflineContract`` -- was gone before PAI ever saw it, silently, since
    # the result is well-formed and merely missing declarations.
    # 0.18 for ``ToolGuard``, and this transport is the reason rather
    # than a bystander. Below it the guard read a single vocabulary -- the
    # destructive metadata key the drf-mcp bridge stamps -- while an in-process
    # ``SpecToolset`` (the ``service_specs=`` path, ``[spec-tools]``) writes
    # ``annotations["readOnlyHint"]`` instead, and nothing translated between
    # them. A spec mutation therefore ran unapproved under
    # ``TOOL_GUARD={"ENABLED": True}`` unless it was also named in
    # ``REQUIRE_APPROVAL``: the setting on, the docs promising a gate, and the
    # tool executing mid-stream anyway. A guard that reads as on while it is off
    # is the worst shape to ship one in, so this floor is not a judgement call
    # about the oldest version that works -- 0.17 demonstrably does not.
    # 0.17 still earns its place: an attached file's tool result has two halves
    # with different lifetimes -- the sentence is streamed and kept in the client
    # transcript, the bytes never travel the event stream at all. This transport
    # seeds later turns from that transcript (``message_history`` stays ``None``
    # unless a run is resumed), so before 0.17 it replayed "its contents are
    # attached" with nothing attached, and the model answered confidently about a
    # document it had never read. And 0.16: below it a row whose blob had left
    # storage raised where the contract says it returns ``None``, and dedup
    # adopted a missing blob so re-uploading could never repair it.
    # 0.21 is the first release whose own spec extras floor drf-services at 0.49,
    # for the bounded schema recursion. This package states that constraint in its
    # own extras too, so the resolver would take the stricter of the two either
    # way -- the floor is here so the claim is not left resting on that, and so a
    # reader is not asked to work out which sibling is carrying it.
    # 0.23 was the previous floor, and it is what makes this package's outcome
    # forwarding truthful for ``drf_mcp_server=``. That bridge is
    # django-pydantic-agent's, and below 0.23 it *returned* a refused or failed
    # drf-mcp call as ``{"error": ...}``, the tool's value, which pydantic-ai
    # records as a success -- so the browser received ``TOOL_CALL_RESULT`` with no
    # ``outcome`` for a call the server refused, the same false "success" the
    # ``[spec-tools]`` floor below exists to rule out on the other route. 0.23
    # raises ``ToolFailed`` instead, carrying the server's sentence and the
    # refusal's code. Held by the test driving a refused bridged tool through a
    # whole session.
    # 0.24 was the previous floor, and it is the one floor here that buys no behaviour
    # of its own. That release changes no code in django-pydantic-agent at all --
    # it raises that package's own ``[drf-mcp]`` and ``[spec-tools]`` extras onto
    # the same bands this package's extras declare below. It is taken for the
    # reason 0.21 was taken: the resolver would pick the stricter of the two
    # either way, and the floor is here so the claim does not rest on that, and so
    # a reader is not asked to work out which sibling is carrying it. Without it
    # the bridge's own backing package still advertises the band in which a bulk
    # spec is refused, while this package's extra says it is offered. Subsumed.
    # 0.25 is the floor now, and unlike 0.24 it is one the browser feels.
    # django-pydantic-agent's drf-mcp bridge now follows tool availability on
    # every model step and names each tool an unmet operation condition left
    # out, with that condition's reason, in the step's instructions. So a user
    # who asks a session for an operation that cannot run right now is told why,
    # in the sentence the rule's author wrote, rather than handed whatever the
    # model infers from a tool's absence. Below it the bridge listed once per
    # run: a condition clearing mid-session brought no tool back, and one
    # closing mid-session left the tool offered until the call refused it. It
    # raises that package's own ``[drf-mcp]`` and ``[spec-tools]`` extras to
    # 0.48 and 0.31, which is why the bands below move with it.
    "django-pydantic-agent>=0.25",
    # Slim core + the AG-UI adapter only — avoids the full meta-package's
    # logfire / fastmcp / temporalio / otel stack. Pick a provider via the
    # extras below (or install the provider lib yourself).
    # The floor buys a stream in which every TOOL_CALL_START names an assistant
    # message the stream actually announced. A response whose first part is a
    # tool call has no text to open that message with, and below this floor the
    # `parentMessageId` was emitted anyway, naming a message no event carried --
    # a client could only answer by minting an id of its own, which then matches
    # nothing in the history echoed back. From here an empty message is opened
    # and closed there instead. Load-bearing rather than tidy: the wire fixture
    # the browser lane builds against is generated from this endpoint, and below
    # this version it regenerates differently.
    "pydantic-ai-slim[ag-ui]>=2.37,<3",
    # Two lifecycles are gated here, and the later one sets the floor. The
    # tool-approval interrupt/resume lifecycle (RUN_FINISHED outcomes +
    # RunAgentInput.resume) needs 0.1.19 (INTERRUPTS_VERSION); a delegated
    # sub-agent's own lifecycle needs the SUBAGENT_STARTED / _FINISHED / _ERROR
    # events, which arrived in 0.1.21 and which the observer imports at module
    # level. pydantic-ai-slim only floors the distribution at >=0.1.10, so both
    # floors are ours to state.
    "ag-ui-protocol>=0.1.21",
]

[project.optional-dependencies]
# Model-provider extras (slim ships none). Install one to use a "provider:model"
# MODEL string, e.g. `pip install django-ag-ui[anthropic]`.
# Anthropic's floor is higher than the others and stays that way. The
# ``anthropic`` SDK 1.0.0 (PyPI, 2026-08-20) is rebuilt on ``httpx2`` and drops
# legacy ``httpx``, and every pydantic-ai before 2.33 hands ``AnthropicProvider``
# an ``httpx.AsyncClient`` the 1.x SDK rejects at runtime -- permitted without
# being supported, so a fresh install at the old floor resolved a broken set.
anthropic = ["pydantic-ai-slim[anthropic]>=2.33,<3"]
openai = ["pydantic-ai-slim[openai]>=2,<3"]
google = ["pydantic-ai-slim[google]>=2,<3"]
# In-process bridge that exposes a drf-mcp-server tool registry as a
# Pydantic-AI toolset (the agent calls DRF tools without a network hop).
# Floored at 0.48, where a server answers in process which tools a listing
# leaves out and why (``aunavailable_tools``) and, on request, lists every tool
# the caller may see whether or not a condition refuses it right now
# (``include_unavailable``). That pair is what django-pydantic-agent's bridge
# needs to keep a model's tools in step with the registry on every step rather
# than once per run, so it is the band 0.25 of that package requires: anything
# lower stated here would advertise a band in which the bridge a
# ``drf_mcp_server=`` agent configures cannot be built. It moves in lockstep
# with the ``[spec-tools]`` floor below, which is the same explanation written
# for the other route.
#
# 0.46 was the previous floor, where a ``ServiceSpec`` declaring ``many=True`` registers
# as a tool and takes its list under one named argument, ``items`` unless the spec
# names another. A ``drf_mcp_server=`` registry carrying a bulk spec therefore
# offers a tool whose result streams to the browser as a list, where the
# registration below this floor refused the spec and listed nothing for it. This
# floor moved in lockstep with the ``[spec-tools]`` one below, as the floor above
# does -- see that comment for why a mismatched pair is worse than either old
# band. 0.46 also stops a
# ``many=True`` chain step collapsing its list to one row through an output
# re-fetch, and refuses a chain that inherits such a step's ``input_serializer``
# rather than handing the bulk service one item as its whole data. It floors
# drf-services at 0.53.0 in turn, and hard: every service dispatch passes
# ``many_as_argument``, which first exists there, so below it a bridged tool call
# raises ``TypeError`` at the call while the package still imports. Subsumed.
#
# 0.45 was the previous floor, the release that serves a refusal's ``code`` in a
# tool's error result, which the bridge carries to the model and, through
# ``outcome``-marked
# results, to the browser. 0.45 also resolves a chain tool's RETRIEVE step to its
# row before the object-level permission judges it: below it a selector returning
# a queryset skipped that check, and a chain step rendered without an output
# serializer answered with the text of the row the rule refuses. And it refused a
# ``many=True`` service spec at registration, which is exactly what 0.46 reverses.
# It floored drf-services at 0.52.1 in turn. Subsumed.
#
# 0.44 was the floor before that, where the tools that bridge lists and calls caught
# up with drf-services' affordances: below it a chain tool ran a step whose
# service's own affordances refuse it, and reported success, and the
# ``outputSchema`` handed to the model left out the ``affordances`` object.
# Subsumed. The package declares no drf-services dependency
# of its own to state the constraint against -- its one import of it,
# ``unguarded_specs``, is lazy and runs only when ``service_specs=`` is set, which
# an extra has already installed -- so the extra carries it.
#
# 0.37 was the previous floor, the first release carrying drf-services>=0.49
# after a serializer that nests itself crashed the catalog walk. Subsumed.
drf-mcp = ["djangorestframework-mcp-server>=0.48"]
# Expose drf-services specs directly as agent tools via djangorestframework-
# pydantic-ai's SpecCapability -- no MCP server in the path (service_specs=).
# Floored at 0.25, the release that raises ToolFailed for a terminal failure
# instead of returning {"error": ...}. That is what this package's outcome
# forwarding has to have underneath it to be truthful: below 0.25 a spec tool's
# conflict or missing row is an ordinary return, which pydantic-ai marks
# outcome="success", so the transport would faithfully forward "success" for a
# call that failed -- a worse state than the silence it replaced, because a
# client would now be reading a field and believing it.
#
# 0.26 raises it again, for the half a consumer's own suite has to reach: it
# ships a streaming test double. The 0.25 double could only serve a
# non-streamed request, and this transport always streams -- so a consumer
# wanting to assert what its browser receives for a failed tool call, which is
# exactly what 0.25 made expressible, had no way to drive one. The floor is
# soft in the sense that nothing here imports it; it is stated because a
# consumer testing this package's outcome forwarding needs it, and finding that
# out from a run that dies before the toolset is touched costs an afternoon.
#
# 0.27 raised it again, and unlike the two above that raise was about what
# happens in production rather than in a consumer's tests. A spec dispatch runs
# on asgiref's process-wide shared thread, and Django closes connections per
# *request* on the *request's* thread -- `django.db.connections` is thread-local,
# so `request_finished` never reaches the connection the dispatch opened. That
# applies here even though every AG-UI call arrives over HTTP: the request
# finishing closes the request thread's connection and nothing else, so a
# long-lived server accumulates one open connection on the shared thread and
# keeps it forever. 0.27 releases what a dispatch opened and leaves what it did
# not, which is the part that makes it safe when asgiref routes back onto a
# caller's own thread mid-transaction.
#
# 0.28 raised it for what the model is told rather than what runs: a spec tool's
# return schema declares the ``affordances`` object drf-services renders into each
# item of a spec declaring them. Below it the model was handed items carrying a
# key the schema said did not exist.
#
# 0.29 was the previous floor. A refused call's text ends with the rule's code, worded
# as the ``[drf-mcp]`` bridge words the same refusal, so a browser rendering a
# failed call reads one sentence whichever route the tool came by. A tool that
# finds nothing returns ``None`` rather than a row of empty fields. And a
# ``many=True`` service spec was refused when the toolset is built, so
# ``service_specs=`` carrying one raised ``ImproperlyConfigured`` instead of
# offering a tool no call can satisfy. It floored drf-services at 0.52.1 in turn.
#
# 0.30 raised it again, withdrawing that last refusal: a ``many=True``
# service spec is a tool taking its list under one named argument, so
# ``service_specs=`` carrying one offers a bulk tool where it raised at build. A
# ``QueryParam`` or ``UrlKwarg`` named after that argument is refused instead, and
# refused at build, rather than making every call come back asking for the
# argument the model had just sent. This floor and the ``[drf-mcp]`` one above
# move together: both siblings reversed the same refusal in the same release, so
# raising one alone leaves the same spec a working tool on one route and an
# ``ImproperlyConfigured`` on the other -- and this package is where that
# disagreement would surface, since a browser transcript is one stream whichever
# route a tool came by. 0.30 floors drf-services at 0.53.0 in turn, and hard:
# every spec call passes ``many_as_argument``, so below it a tool call raises
# ``TypeError`` once a model calls one.
#
# 0.31 is the floor now, and it is about what the model is told when a tool is
# missing rather than about which tools exist: each operation an unmet operation
# condition left out is named in that step's instructions, with that condition's
# reason, so a user who asks for one is answered in the sentence the rule's
# author wrote rather than in whatever the model infers from an absence. It
# moves in lockstep with the ``[drf-mcp]`` floor above for the reason 0.30 did:
# django-pydantic-agent's bridge now writes that same sentence for the same
# rule, so below this a session reads one way for a tool that arrived by MCP and
# another for one that arrived as a spec -- and this package is where that
# disagreement would surface, since a browser transcript is one stream whichever
# route a tool came by.
#
# 0.24 was the floor before these, the first release carrying drf-services>=0.49
# after a self-nesting serializer took SpecToolset down at construction. That
# constraint still holds and is subsumed.
spec-tools = ["djangorestframework-pydantic-ai>=0.31"]
# pydantic-ai-harness capabilities (lazy-imported; core stays slim): step
# persistence, compaction, subagents, and the rest of the graduated set. Attach
# via capabilities=.
harness = ["pydantic-ai-harness>=0.13"]
# CodeMode as well — wrapping many tools (e.g. the drf-mcp bridge) into one
# sandboxed `run_code`. Separate because the sandbox (`pydantic-monty`) is
# 7.5 MB installed, which a project wiring step persistence should not pay for
# a capability it never configures. `[harness]` required it until this split.
code-mode = ["pydantic-ai-harness[code-mode]>=0.13"]

[project.urls]
Homepage = "https://github.com/Artui/django-ag-ui"
Repository = "https://github.com/Artui/django-ag-ui"
Issues = "https://github.com/Artui/django-ag-ui/issues"

[tool.hatch.version]
path = "django_ag_ui/version.py"
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["django_ag_ui"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.32",
    "pre-commit>=3.8.0",
    "pytest>=8.0",
    "pytest-django>=4.11.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.0",
    # The [drf-mcp] extra's backing package, so its bridge + tests run in dev.
    "djangorestframework-mcp-server>=0.48",
    # The [spec-tools] extra's backing package, so its capability + tests run in dev.
    "djangorestframework-pydantic-ai>=0.31",
    # The [harness] extra's backing package, so the CodeMode recipe test runs in dev.
    "pydantic-ai-harness[code-mode]>=0.13",
    # Provider libs so the API_KEY / PROVIDER model-building path is exercised
    # in dev/CI (the extras above ship to consumers, not the dev env).
    # Floored with the ``anthropic`` extra above, for the reason given there --
    # the floor job resolves this group too.
    "pydantic-ai-slim[anthropic,openai,google]>=2.33",
    # A real ASGI server for the heartbeat's wire test. Every in-process client
    # reads a response it already holds, so whether a frame reaches the socket
    # *during* a silence -- the only thing an idle proxy sees -- needs a socket.
    "uvicorn>=0.30",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
addopts = "--cov=django_ag_ui --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
# drf-mcp 0.20+ warns when a tool is registered with no description. The bridge
# fixtures register throwaway tools, where a description would be noise. Matched
# on the message: naming the category by dotted path makes pytest import drf-mcp
# at config time, before DJANGO_SETTINGS_MODULE is applied.
filterwarnings = [
    "ignore:MCP tool .* is registered with no description",
    # Most fixtures construct a view in its default state, which is exactly the
    # state the CSRF guard warns about — so without this every one of them
    # carries the same warning and the signal is lost. ``pytest.warns`` still
    # sees it (it installs its own "always" filter), which is where the guard
    # is asserted. (Matched without the "django-ag-ui:" prefix — a colon in the
    # pattern is pytest's own field separator.)
    "ignore:.*AG-UI endpoint is CSRF-exempt",
]

[tool.coverage.run]
branch = true
source = ["django_ag_ui"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = [
    "E203",
    "E501",
    "E231",
    "F811",
    "E722",
    "E741",
    # PEP 695 syntax. The package uses ``TypeVar`` + ``Generic[T]``; without
    # these three, ``ruff --fix`` rewrites code *into* the syntax CLAUDE.md
    # forbids.
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["django_ag_ui"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md forbids every relative form, including single-dot. TID's default is
# "parents", which lets ``from .foo import bar`` through.
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
root = ["./django_ag_ui"]

# bump-my-version drives `make release-bump` — it rewrites the version in
# django_ag_ui/version.py and promotes the CHANGELOG [Unreleased] block
# under a new dated heading.
[tool.bumpversion]
current_version = "0.61.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "django_ag_ui/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/django-ag-ui/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/django-ag-ui/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/django-ag-ui/compare/v{current_version}...v{new_version}"""
